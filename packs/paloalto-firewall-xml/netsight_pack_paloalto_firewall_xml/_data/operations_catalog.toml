# Operations catalog for paloalto-firewall-xml.
#
# Every entry declares:
#
#   command         — XML payload for type="op" operations (empty for log ops)
#   type            — dispatch shape: "op" (XML command) or "log" (log query)
#   log_type        — REQUIRED for type="log": the PAN-OS log channel name
#                     ("traffic", "threat", "system", "config", "url", etc.)
#   category        — coarse grouping for UX / filtering
#   description     — one-line human-readable summary
#   read_only       — MUST be true; write operations are refused at compile time
#   parser_spec     — optional path to a parser YAML under parsers/
#   required_model  — "*" (any PAN-OS model) or a list like ["pa-vm", "panorama"]
#
# The paloalto-firewall-xml pack currently supports every listed operation
# on every PAN-OS model — so every required_model is the wildcard "*". When
# a future operation becomes model-specific (e.g. a Panorama-only command),
# change its required_model to ["panorama"] and the BaseDeviceClient model
# gate will refuse it on non-Panorama devices at execute time.

[show_system_info]
command = "<show><system><info></info></system></show>"
type = "op"
required_model = "*"
category = "system"
description = "Show system information and uptime"
read_only = true
parser_spec = "parsers/show_system_info.yaml"

[show_interfaces]
command = "<show><interface>all</interface></show>"
type = "op"
required_model = "*"
category = "network"
description = "Show all interface status"
read_only = true
parser_spec = "parsers/show_interfaces.yaml"

