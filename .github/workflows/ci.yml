name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install netsight-sdk + pack
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/magicboxlab-ai/netsight-sdk.git"
          pip install -e "packs/paloalto-firewall-xml[test]"

      - name: Run pack tests
        run: |
          python -m pytest packs/paloalto-firewall-xml/tests/ -q
